name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Not `assigned`: it re-ran the same @claude request every time the issue
  # was assigned to anyone, spending a whole session each time.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the repository owner can summon Claude. Without the author checks,
    # anyone with write access could, and the action's own permission check is
    # the only thing standing between a public commenter and this repo's Claude
    # token. Each event carries its author in a different field.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        github.event.review.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so a review can diff the PR against main instead of
          # reading the branch's files with nothing to compare them to.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        # Pinned to a commit: this step holds CLAUDE_CODE_OAUTH_TOKEN, so a
        # moved tag must not change what runs. Dependabot proposes updates.
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # On top of the action's defaults (read files, git add/commit/push):
          # read-only git and gh, so Claude can see what a PR changes. Nothing
          # that installs or runs the project. On someone else's PR that would
          # execute their code (install scripts, Vite and TypeScript config) on
          # a runner holding CLAUDE_CODE_OAUTH_TOKEN. Typecheck and build run in
          # ci.yml instead, with no secrets, and Claude can read those results.
          claude_args: >-
            --allowedTools
            "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git status:*),Bash(git branch:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

