<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IB EconGraph AI">
  <defs>
    <linearGradient id="econgraph-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <!-- Tailwind: blue-600 (#2563eb) to indigo-600 (#4f46e5) -->
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background to match the in-app logo tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#econgraph-grad)"/>

  <!-- Simple bar chart glyph, sized to read well at 16–32px -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 44H46" />
    <path d="M22 44V30" />
    <path d="M32 44V20" />
    <path d="M42 44V26" />
  </g>
</svg>
